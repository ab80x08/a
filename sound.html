<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Audio Spectrum (Precise)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0e1117; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow: auto; padding: 20px; }
    h1 { margin: 8px 0; font-weight: 600; font-size: 1.25rem; }
    p { color: #8b949e; margin-bottom: 8px; font-size: 0.9rem; }

    .controls { display: flex; gap: 12px; margin: 8px 0 14px 0; align-items: center; flex-wrap: wrap; }
    button, .btn { background-color: #238636; color: #fff; border: none; padding: 8px 12px; font-size: 0.95rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background-color 0.15s ease, transform 0.06s ease; }
    .btn.secondary { background: #1f2937; }
    .btn.warn { background: #b91c1c; }
    .switch { display: inline-flex; align-items: center; gap: 8px; color: #8b949e; }
    label { font-size: 0.9rem; color: #8b949e; }
    .group { display:flex; gap:8px; align-items:center; }

    .controls-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }

    canvas { background: #161b22; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #30363d; width: 90vw; max-width: 1200px; height: 360px; }
    .note { color: #8b949e; font-size: 0.8rem; margin-top: 10px; }

    .tooltip { position: absolute; pointer-events: none; background: rgba(20,20,24,0.95); color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; border: 1px solid rgba(255,255,255,0.06); transform: translate(-50%, -120%); white-space: nowrap; }

    .slider { width: 160px; }
    .legend { color:#8b949e; font-size:12px; margin-left:6px; }
  </style>
</head>
<body>
  <h1>Real-Time Audio Spectrum</h1>
  <p>Now with hover tooltips, dB legend, octave labels, A-weighting toggle, linear/log frequency scale, peak tuning and CSV export.</p>

  <div class="controls">
    <button id="startButton">Start Microphone</button>
    <button id="stopButton" style="display:none; background:#c026d3">Stop</button>

    <div class="switch"><input type="checkbox" id="peakHold" /> <label for="peakHold">Peak hold</label></div>
    <div class="switch"><input type="checkbox" id="perfMode" /> <label for="perfMode">Performance mode</label></div>
    <div class="switch"><input type="checkbox" id="aWeight" /> <label for="aWeight">A-weighting</label></div>
    <div class="switch"><label for="freqScale">Scale:</label><select id="freqScale"><option value="log">Log</option><option value="linear">Linear</option></select></div>

    <button id="exportCsv" class="btn secondary">Export CSV</button>
    <button id="snapshot" class="btn secondary">Snapshot</button>
    <button id="resetPeaks" class="btn secondary">Reset peaks</button>
  </div>

  <div class="controls-row">
    <div class="group"> <label>Peak decay (dB/s)</label> <input id="peakDecay" type="range" min="1" max="60" value="24" class="slider" /> <span id="peakDecayVal" class="legend">24</span></div>
    <div class="group"> <label>Peak hold (s)</label> <input id="peakHoldTime" type="range" min="0" max="10" value="2" class="slider" /> <span id="peakHoldVal" class="legend">2.0</span></div>
    <div class="group"> <label>Peak color</label> <input id="peakColor" type="color" value="#ffffff" /></div>
  </div>

  <canvas id="canvas" width="1200" height="360"></canvas>
  <div class="note">Tip: Performance mode lowers FFT and frame rate. Snapshot downloads a CSV of current bar frequencies and dB values.</div>

  <div id="tooltip" class="tooltip" style="display:none"></div>

  <script>
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const peakHoldCheckbox = document.getElementById('peakHold');
    const perfModeCheckbox = document.getElementById('perfMode');
    const aWeightCheckbox = document.getElementById('aWeight');
    const freqScaleSelect = document.getElementById('freqScale');
    const exportCsvBtn = document.getElementById('exportCsv');
    const snapshotBtn = document.getElementById('snapshot');
    const resetPeaksBtn = document.getElementById('resetPeaks');
    const peakDecaySlider = document.getElementById('peakDecay');
    const peakDecayVal = document.getElementById('peakDecayVal');
    const peakHoldTimeSlider = document.getElementById('peakHoldTime');
    const peakHoldVal = document.getElementById('peakHoldVal');
    const peakColorInput = document.getElementById('peakColor');
    const tooltip = document.getElementById('tooltip');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Audio variables
    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let floatData = null; // Float32Array for dB values
    let bufferLength = 0;

    // Visualization state
    let rafId = null;
    let isVisualizing = false;
    let peaks = [];
    let peakTimestamps = [];

    // Settings
    const SETTINGS = {
      hi: { FFT_SIZE: 2048, SMOOTHING: 0.85, targetFPS: 60 },
      perf: { FFT_SIZE: 1024, SMOOTHING: 0.65, targetFPS: 30 }
    };

    let mode = 'hi';
    const MIN_DB = -100; const MAX_DB = -20;

    // Resize canvas for high-DPI
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(300, rect.width || 1200);
      const height = Math.max(120, rect.height || 360);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);

    function getNumBars() {
      const w = canvas.width / (window.devicePixelRatio || 1);
      const targetBarWidth = 6; // px
      return Math.max(24, Math.min(256, Math.floor(w / targetBarWidth)));
    }

    function applyModeSettings() {
      if (!analyser) return;
      const s = mode === 'hi' ? SETTINGS.hi : SETTINGS.perf;
      analyser.fftSize = s.FFT_SIZE;
      analyser.smoothingTimeConstant = s.SMOOTHING;
      bufferLength = analyser.frequencyBinCount;
      floatData = new Float32Array(bufferLength);
      peaks = new Array(getNumBars()).fill(MIN_DB);
      peakTimestamps = new Array(getNumBars()).fill(0);
    }

    // A-weighting filter approximation (in dB) based on frequency (Hz)
    // Reference: standard A-weighting curve approximation
    function aWeightDb(freq) {
      // avoid div by zero
      if (freq <= 0) return 0;
      const f2 = freq * freq;
      const ra = (12200*12200*f2*f2)/((f2+20.6*20.6)*(f2+12200*12200)*Math.sqrt((f2+107.7*107.7)*(f2+737.9*737.9)));
      const a = 20 * Math.log10(ra) + 2.00; // offset to approximate
      return a;
    }

    function dbToNorm(db) {
      return Math.min(1, Math.max(0, (db - MIN_DB) / (MAX_DB - MIN_DB)));
    }

    // Convert dB to human-readable with 1 decimal
    function formatDb(db) { return Math.round(db * 10) / 10 + ' dB'; }

    function freqForBar(i, numBars, fftSize, sampleRate, scale) {
      const end = fftSize / 2;
      if (scale === 'linear') {
        const startBin = Math.floor((i / numBars) * end);
        const endBin = Math.floor(((i + 1) / numBars) * end);
        const startHz = startBin * (sampleRate / fftSize);
        const endHz = Math.max(startHz + 1, endBin * (sampleRate / fftSize));
        return [startHz, endHz];
      } else {
        const logStart = Math.floor(Math.pow(i / numBars, 2) * end);
        const logEnd = Math.floor(Math.pow((i + 1) / numBars, 2) * end);
        const startHz = logStart * (sampleRate / fftSize);
        const endHz = Math.max(startHz + 1, logEnd * (sampleRate / fftSize));
        return [startHz, endHz];
      }
    }

    // Return approximate center frequency for a bar
    function centerFreqForBar(i, numBars, fftSize, sampleRate, scale) {
      const r = freqForBar(i, numBars, fftSize, sampleRate, scale);
      return (r[0] + r[1]) / 2;
    }

    function freqToX(freq, fftSize, sampleRate, numBars, w, scale) {
      const bin = Math.round(freq / (sampleRate / fftSize));
      const endFreq = fftSize / 2 - 1;
      for (let i = 0; i < numBars; i++) {
        let from, to;
        if (scale === 'linear') {
          from = Math.floor((i / numBars) * endFreq);
          to = Math.floor(((i + 1) / numBars) * endFreq);
        } else {
          from = Math.floor(Math.pow(i / numBars, 2) * endFreq);
          to = Math.floor(Math.pow((i + 1) / numBars, 2) * endFreq);
        }
        if (bin >= from && bin <= to) {
          const barWidth = w / numBars;
          return i * barWidth + barWidth / 2;
        }
      }
      return null;
    }

    // Start audio
    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        mode = perfModeCheckbox.checked ? 'perf' : 'hi';
        analyser.minDecibels = MIN_DB; analyser.maxDecibels = MAX_DB;
        applyModeSettings();
        microphone = audioCtx.createMediaStreamSource(stream);
        microphone.connect(analyser);

        startButton.style.display = 'none'; stopButton.style.display = 'inline-block'; isVisualizing = true;
        lastDrawTime = performance.now();
        draw();
      } catch (err) {
        alert('Microphone access denied or not supported by your browser.'); console.error(err);
      }
    }

    function stopAudio() {
      if (!audioCtx) return;
      isVisualizing = false; if (rafId) cancelAnimationFrame(rafId); rafId = null;
      if (audioCtx.state !== 'closed') audioCtx.close().catch(()=>{});
      audioCtx = null; analyser = null; microphone = null; floatData = null; bufferLength = 0;
      stopButton.style.display = 'none'; startButton.style.display = 'inline-block';
      const w = canvas.width / (window.devicePixelRatio || 1); const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.fillStyle = '#161b22'; ctx.fillRect(0,0,w,h);
    }

    let lastDrawTime = 0;
    function draw(now) {
      if (!isVisualizing || !analyser) return; rafId = requestAnimationFrame(draw);
      const s = mode === 'hi' ? SETTINGS.hi : SETTINGS.perf; const targetInterval = 1000 / s.targetFPS;
      if (now - lastDrawTime < targetInterval) return; lastDrawTime = now;

      analyser.getFloatFrequencyData(floatData);
      const w = canvas.width / (window.devicePixelRatio || 1); const h = canvas.height / (window.devicePixelRatio || 1);
      ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, w, h);

      const numBars = getNumBars(); const barWidth = w / numBars; const sampleRate = audioCtx.sampleRate; const fftSize = analyser.fftSize; const endFreq = bufferLength - 1;

      // dB grid and labels
      ctx.fillStyle = '#8b949e'; ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const dbStep = 10; for (let db = MAX_DB; db >= MIN_DB; db -= dbStep) {
        const y = h - dbToNorm(db) * h; ctx.globalAlpha = 0.12; ctx.fillRect(48, y, w - 56, 1); ctx.globalAlpha = 1;
        ctx.fillStyle = '#8b949e'; ctx.fillText(db + ' dB', 6, y - 6);
      }

      // draw bars
      const nowTs = performance.now() / 1000;
      let x = 0;
      const scale = freqScaleSelect.value;
      for (let i = 0; i < numBars; i++) {
        let from, to;
        if (scale === 'linear') { from = Math.floor((i / numBars) * endFreq); to = Math.floor(((i+1)/numBars) * endFreq); }
        else { from = Math.floor(Math.pow(i / numBars, 2) * endFreq); to = Math.floor(Math.pow((i+1)/numBars, 2) * endFreq); }
        from = Math.min(Math.max(from, 0), endFreq); to = Math.min(Math.max(to, from), endFreq);

        let sum = 0, count = 0;
        for (let j = from; j <= to; j++) { let db = floatData[j]; if (isFinite(db)) { // apply A-weighting if enabled
            if (aWeightCheckbox.checked) {
              const freq = j * (sampleRate / fftSize);
              db += aWeightDb(freq);
            }
            sum += db; count++; }
        }
        const magnitudeDb = count > 0 ? (sum / count) : MIN_DB;

        // peak logic with hold
        const decay = parseFloat(peakDecaySlider.value);
        const holdTime = parseFloat(peakHoldTimeSlider.value);
        if (peakHoldCheckbox.checked) {
          if (peaks[i] === undefined) { peaks[i] = magnitudeDb; peakTimestamps[i] = nowTs; }
          if (magnitudeDb > peaks[i]) { peaks[i] = magnitudeDb; peakTimestamps[i] = nowTs; }
          else {
            const age = nowTs - peakTimestamps[i];
            if (age > holdTime) { // start decaying after holdTime
              peaks[i] = peaks[i] - decay * (age - holdTime) * (targetInterval/1000);
              if (peaks[i] < magnitudeDb) peaks[i] = magnitudeDb;
              peakTimestamps[i] = nowTs;
            }
          }
        }

        const norm = dbToNorm(magnitudeDb);
        const barHeight = norm * h;
        const hue = 220 - (norm * 220);
        const saturation = Math.max(45, 60 + norm * 20);
        const lightness = 40 + norm * 20;
        ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

        const px = x + 48; const pw = Math.max(2, barWidth - 4); const py = h - barHeight; const radius = Math.min(6, pw/2, 12);
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(px, py, pw, barHeight, radius); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(px+radius,py); ctx.arcTo(px+pw,py,px+pw,py+barHeight,radius); ctx.arcTo(px+pw,py+barHeight,px,py+barHeight,radius); ctx.arcTo(px,py+barHeight,px,py,radius); ctx.arcTo(px,py,px+pw,py,radius); ctx.closePath(); ctx.fill(); }

        // peak marker
        if (peakHoldCheckbox.checked && peaks[i] !== undefined) {
          const peakNorm = dbToNorm(peaks[i]); const peakY = h - peakNorm * h;
          ctx.fillStyle = peakColorInput.value; ctx.globalAlpha = 0.95; ctx.fillRect(px, peakY - 2, pw, 2); ctx.globalAlpha = 1;
        }

        x += barWidth;
      }

      // frequency ticks
      const freqs = [20,50,100,200,500,1000,2000,5000,10000,16000]; ctx.fillStyle = '#8b949e'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const f of freqs) { const fx = freqToX(f, fftSize, sampleRate, numBars, w, scale); if (fx !== null) { const drawX = fx + 48; ctx.globalAlpha = 0.6; ctx.fillRect(drawX - 0.5, h - 18, 1, 12); ctx.globalAlpha = 1; ctx.fillText((f>=1000)?(f/1000)+'k':f+'Hz', drawX, h - 16); } }

      // left legend label
      ctx.fillStyle = '#8b949e'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('dB', 6, 14);
    }

    // Tooltip handling
    canvas.addEventListener('mousemove', (e) => {
      if (!analyser || !floatData) return; const rect = canvas.getBoundingClientRect(); const dpr = window.devicePixelRatio||1;
      const cx = (e.clientX - rect.left); const cy = (e.clientY - rect.top);
      const w = canvas.width / dpr; const h = canvas.height / dpr; const numBars = getNumBars(); const barWidth = w / numBars; const xNoMargin = cx - 48;
      if (xNoMargin < 0 || xNoMargin > w) { tooltip.style.display = 'none'; return; }
      let barIndex = Math.floor(xNoMargin / barWidth); barIndex = Math.max(0, Math.min(numBars-1, barIndex));
      const fftSize = analyser.fftSize; const sampleRate = audioCtx.sampleRate; const scale = freqScaleSelect.value;
      const [startHz, endHz] = freqForBar(barIndex, numBars, fftSize, sampleRate, scale);
      // compute magnitude for display
      const from = Math.floor(startHz / (sampleRate/fftSize)); const to = Math.floor(endHz / (sampleRate/fftSize));
      let sum=0,count=0; for (let j=Math.max(0,from); j<=Math.min(to,floatData.length-1); j++){ let db=floatData[j]; if (isFinite(db)){ if (aWeightCheckbox.checked){ const freq=j*(sampleRate/fftSize); db += aWeightDb(freq);} sum+=db; count++; }}
      const magDb = count>0 ? (sum/count) : MIN_DB; const peakDb = peaks[barIndex] || magDb;
      tooltip.innerText = `${Math.round(startHz)}–${Math.round(endHz)} Hz  •  ${formatDb(magDb)}  •  peak ${formatDb(peakDb)}`;
      tooltip.style.display = 'block'; tooltip.style.left = (e.clientX) + 'px'; tooltip.style.top = (e.clientY - 12) + 'px';
    });
    canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

    // Export CSV
    function exportCsv() {
      if (!analyser || !floatData) return;
      const numBars = getNumBars(); const fftSize = analyser.fftSize; const sampleRate = audioCtx.sampleRate; const scale = freqScaleSelect.value;
      const rows = [['bar','startHz','endHz','centerHz','dB','peak_dB']];
      for (let i=0;i<numBars;i++){ const [s,e]=freqForBar(i,numBars,fftSize,sampleRate,scale); const c=centerFreqForBar(i,numBars,fftSize,sampleRate,scale); // compute dB
        const from = Math.floor(s/(sampleRate/fftSize)); const to = Math.floor(e/(sampleRate/fftSize)); let sum=0,count=0; for(let j=Math.max(0,from); j<=Math.min(to,floatData.length-1); j++){ let db=floatData[j]; if (isFinite(db)){ if (aWeightCheckbox.checked){ db+=aWeightDb(j*(sampleRate/fftSize)); } sum+=db; count++; }} const magDb = count>0 ? sum/count : MIN_DB; rows.push([i, Math.round(s), Math.round(e), Math.round(c), Math.round(magDb*10)/10, Math.round((peaks[i]||magDb)*10)/10]); }
      const csv = rows.map(r => r.join(',')).join('\n'); const blob = new Blob([csv], {type:'text/csv'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download = `spectrum_snapshot_${Date.now()}.csv`; a.click(); URL.revokeObjectURL(url);
    }

    exportCsvBtn.addEventListener('click', exportCsv);
    snapshotBtn.addEventListener('click', exportCsv);

    // UI events
    startButton.addEventListener('click', () => initAudio());
    stopButton.addEventListener('click', () => stopAudio());
    perfModeCheckbox.addEventListener('change', () => { mode = perfModeCheckbox.checked ? 'perf' : 'hi'; applyModeSettings(); });
    resetPeaksBtn.addEventListener('click', () => { peaks = new Array(getNumBars()).fill(MIN_DB); peakTimestamps = new Array(getNumBars()).fill(0); });

    peakDecaySlider.addEventListener('input', () => { peakDecayVal.innerText = peakDecaySlider.value; });
    peakHoldTimeSlider.addEventListener('input', () => { peakHoldVal.innerText = (peakHoldTimeSlider.value); });

    // initialize default UI values
    peakDecayVal.innerText = peakDecaySlider.value; peakHoldVal.innerText = peakHoldTimeSlider.value;

    // Initial clear
    ctx.fillStyle = '#161b22'; ctx.fillRect(0,0,canvas.width,canvas.height);
  </script>
</body>
</html>
